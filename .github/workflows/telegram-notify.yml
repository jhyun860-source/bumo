name: Telegram Carousel Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new carousel folder
        id: find
        run: |
          FOLDER=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^[0-9]{2}_[^/]+/script\.md$' | head -1 | xargs -r dirname)
          if [ -z "$FOLDER" ]; then
            echo "No new carousel content in this push, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Send to Telegram
        if: steps.find.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOLDER: ${{ steps.find.outputs.folder }}
        run: |
          set -e
          TITLE=$(basename "$FOLDER")
          BODY=$(cat "$FOLDER/script.md")
          MSG="[부모대화] 오늘의 카루셀 — ${TITLE}"$'\n\n'"${BODY}"
          MSG="${MSG:0:3900}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

          MEDIA_JSON="["
          FORM_ARGS=()
          i=0
          for f in "$FOLDER"/*.png; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ $i -gt 0 ]; then MEDIA_JSON+=","; fi
            MEDIA_JSON+="{\"type\":\"photo\",\"media\":\"attach://$name\"}"
            FORM_ARGS+=(-F "$name=@$f")
            i=$((i+1))
          done
          MEDIA_JSON+="]"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "media=${MEDIA_JSON}" \
            "${FORM_ARGS[@]}" > /dev/null

          echo "Sent $FOLDER to Telegram"
